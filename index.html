<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePulse X | Solar Industrial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;700&display=swap"
    rel="stylesheet">
  <style>
    html,
    body,
    * {
      cursor: none !important;
    }

    :root {
      --accent: #f59e0b;
      --danger: #dc2626;
      --bg: #050505;
      --surface: #0c0a09;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: #e7e5e4;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Tactical Grid Background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(to right, var(--grid-color, rgba(245, 158, 11, 0.03)) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color, rgba(245, 158, 11, 0.03)) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    ::selection {
      background: var(--accent);
      color: black;
    }

    .industrial-card {
      background: var(--surface);
      border: 1px solid #1c1917;
      position: relative;
    }

    .accent-glow {
      box-shadow: 0 0 50px -15px var(--accent-transparent, rgba(245, 158, 11, 0.4));
    }

    .crimson-glow {
      box-shadow: 0 0 50px -15px rgba(220, 38, 38, 0.4);
    }

    .scanline {
      width: 100%;
      height: 100px;
      z-index: 99;
      background: linear-gradient(0deg, transparent 0%, var(--scanline-color, rgba(245, 158, 11, 0.02)) 50%, transparent 100%);
      opacity: 0.1;
      position: absolute;
      bottom: 100%;
      animation: scanline 8s linear infinite;
      pointer-events: none;
    }

    @keyframes scanline {
      0% {
        bottom: 100%;
      }

      100% {
        bottom: -100px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.3.0",
        "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
        "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <div class="scanline"></div>
  <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
